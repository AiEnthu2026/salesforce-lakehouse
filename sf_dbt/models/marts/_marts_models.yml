version: 2

models:
  - name: mart_account_monthly_health
    description: One row per account and month, with contract utilisation, escalation rate and usage trend. Driven by the monthly aggregate, with the contract table left joined. Months where an account has no contract row, or no contract at all, are labelled no_commitment. Month-over-month change is null when the previous month is missing. Thresholds for commit_status are the util_under_pct and util_over_pct project variables.
    columns:
      - name: account_month_key
        data_tests:
          - unique
          - not_null
      - name: commit_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['no_commitment', 'under', 'on_track', 'over']