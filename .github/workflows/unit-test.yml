name: Unit Tests (dev)

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: salesforce-dev
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      BUNDLE_VAR_catalog_name: ${{ vars.CATALOG_NAME }}
      BUNDLE_VAR_landing_base: ${{ secrets.LANDING_BASE }}
      BUNDLE_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.19.0

      - name: Deploy bundle to dev
        run: databricks bundle deploy -t dev

      - name: Run unit tests
        run: databricks bundle run salesforce_test_suite -t dev